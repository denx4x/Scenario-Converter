name: Build release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows application
        shell: pwsh
        run: ./build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v','')
      - name: Create draft release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" bin/Scenario-Converter.exe bin/Scenario-Converter.exe.sha256 --verify-tag --draft --generate-notes --title "Scenario Converter $env:GITHUB_REF_NAME"
